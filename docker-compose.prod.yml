services:
  api:
    image: ghcr.io/alisher134/tarih-api:latest
    container_name: tarih-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 8080
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DATABASE_URL: postgresql://${POSTGRES_USER:-tarih}:${POSTGRES_PASSWORD:-tarih}@postgres:5432/${POSTGRES_DB:-tarih}?schema=public
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://minio.tarih-edu.kz}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      - ./:/seed-files:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/v1/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - tarih-network

  postgres:
    image: postgres:16-alpine
    container_name: tarih-postgres
    restart: unless-stopped
    shm_size: 256mb
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tarih}
      POSTGRES_USER: ${POSTGRES_USER:-tarih}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tarih}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - tarih-network

  minio:
    image: alpine/minio:latest-release
    container_name: tarih-minio
    restart: unless-stopped
    user: root
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_API_CORS_ALLOW_ORIGIN: ${CORS_ORIGIN:-*}
      MINIO_SERVER_URL: ${MINIO_SERVER_URL:-http://minio.tarih-edu.kz}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL:-http://minio.tarih-edu.kz/minio/ui}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - tarih-network

  minio-init:
    image: drpsychick/minio-client:latest
    container_name: tarih-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_HOST: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-tarih-storage}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    volumes:
      - ./docker/minio/init.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "/init.sh"]
    restart: "no"
    networks:
      - tarih-network

volumes:
  postgres_data:
  minio_data:

networks:
  tarih-network:
    name: tarih-network
